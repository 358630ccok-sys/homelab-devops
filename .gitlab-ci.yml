stages:
  - validate
  - deploy

default:
  image: python:3.11-slim

validate:syntax:
  stage: validate
  script:
    - apt-get update -qq && apt-get install -y -qq yamllint openssh-client >/dev/null
    - python3 -m py_compile telegram-bot/bot.py scripts/obsidian_sync.py
    - python3 -m json.tool grafana/dashboards/mlops-tv-kiosk.json >/dev/null
    - yamllint -d "{extends: default, rules: {line-length: {max: 220}, document-start: disable, truthy: disable}}" prometheus/prometheus.yml .gitlab-ci.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

deploy:configs:
  stage: deploy
  needs: ["validate:syntax"]
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
        echo "DEPLOY_SSH_KEY is not set"; exit 1
      fi
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - export SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=10"
  script:
    - |
      set -e
      CHANGED_PROM="0"; CHANGED_GRAF="0"; CHANGED_BOT="0"; CHANGED_SYNC="0"
      if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" | grep -q '^prometheus/prometheus.yml$' && CHANGED_PROM="1" || true
        git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" | grep -q '^grafana/dashboards/mlops-tv-kiosk.json$' && CHANGED_GRAF="1" || true
        git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" | grep -qE '^telegram-bot/' && CHANGED_BOT="1" || true
        git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" | grep -q '^scripts/obsidian_sync.py$' && CHANGED_SYNC="1" || true
      else
        CHANGED_PROM="1"; CHANGED_GRAF="1"; CHANGED_BOT="1"; CHANGED_SYNC="1"
      fi
      echo "Changes: prometheus=$CHANGED_PROM grafana=$CHANGED_GRAF telegram-bot=$CHANGED_BOT sync=$CHANGED_SYNC"

      # Prometheus (CT 105)
      if [ "$CHANGED_PROM" = "1" ]; then
        scp $SSH_OPTS prometheus/prometheus.yml root@192.168.10.105:/opt/prometheus/config/prometheus.yml
        ssh $SSH_OPTS root@192.168.10.105 'docker restart prometheus'
      fi

      # Grafana dashboard (CT 106)
      if [ "$CHANGED_GRAF" = "1" ]; then
        scp $SSH_OPTS grafana/dashboards/mlops-tv-kiosk.json root@192.168.10.106:/tmp/mlops-tv-kiosk.json
        ssh $SSH_OPTS root@192.168.10.106 'docker cp /tmp/mlops-tv-kiosk.json grafana:/etc/grafana/provisioning/dashboards_json/mlops-tv-kiosk.json && rm -f /tmp/mlops-tv-kiosk.json && docker restart grafana'
      fi

      # Telegram bot (CT 118)
      if [ "$CHANGED_BOT" = "1" ]; then
        scp $SSH_OPTS telegram-bot/bot.py telegram-bot/requirements.txt root@192.168.10.118:/opt/telegram-bot/
        ssh $SSH_OPTS root@192.168.10.118 'python3 -m py_compile /opt/telegram-bot/bot.py && systemctl restart telegram-bot.service'
      fi

      # Obsidian sync script (CT 134)
      if [ "$CHANGED_SYNC" = "1" ]; then
        scp $SSH_OPTS scripts/obsidian_sync.py root@192.168.10.134:/home/node/.n8n/obsidian_sync.py
        ssh $SSH_OPTS root@192.168.10.134 'docker cp /home/node/.n8n/obsidian_sync.py n8n:/home/node/.n8n/obsidian_sync.py || true'
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
